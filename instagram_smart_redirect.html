<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Intelligente Instagram</title>
  <script>
    window.onload = function() {
      // Prova ad aprire l'app Instagram
      window.location = 'instagram://user?username=gonzo.riccardo';
      // Dopo 1.5 secondi, se l'app non si apre, reindirizza al browser
      setTimeout(function() {
        window.location = 'https://www.instagram.com/gonzo.riccardo';
      }, 1500);
    };
  </script>
</head>
<body>
  <p>Reindirizzamento in corso...</p>
  <p>Se non vieni reindirizzato automaticamente, <a href="https://www.instagram.com/gonzo.riccardo">clicca qui</a>.</p>
</body>
</html>
